name: Agent Kumbang - Database Fluktuasi

on:
  schedule:
    # Jadwal GitHub "best effort": bisa terlambat atau DILEWATI saat server GitHub ramai.
    # Karena itu dipasang beberapa jadwal cadangan; job "cek-jadwal" memastikan agent hanya
    # benar-benar jalan SEKALI per hari (jadwal berikutnya dilewati jika sudah sukses hari ini).
    # Terlambat boleh, terlewat jangan: 10 jadwal tersebar 16.30-18.23 WIB, di menit "ganjil"
    # (menit :00/:30 paling padat di GitHub). Jam dalam UTC (WIB = UTC+7).
    - cron: "30 9 * * *"   # 16.30 WIB  (utama)
    - cron: "37 9 * * *"   # 16.37 WIB  (cadangan)
    - cron: "44 9 * * *"   # 16.44 WIB
    - cron: "51 9 * * *"   # 16.51 WIB
    - cron: "7 10 * * *"   # 17.07 WIB
    - cron: "23 10 * * *"  # 17.23 WIB
    - cron: "37 10 * * *"  # 17.37 WIB
    - cron: "53 10 * * *"  # 17.53 WIB
    - cron: "7 11 * * *"   # 18.07 WIB
    - cron: "23 11 * * *"  # 18.23 WIB
  workflow_dispatch:
    # Tombol "Run workflow" di tab Actions untuk menjalankan manual (selalu jalan, tanpa cek)
    inputs:
      mode:
        description: "penuh = tarik + upload | cek = tarik saja, upload hanya dicek"
        type: choice
        options: [penuh, cek]
        default: penuh

# Jangan pernah jalan dua kali bersamaan (Import Excel portal menghapus & menulis ulang data).
# Jadwal cadangan yang datang saat agent masih jalan akan MENUNGGU, lalu dicek ulang.
concurrency:
  group: agent-kumbang
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # untuk membaca riwayat run (cek sudah sukses hari ini)

jobs:
  cek-jadwal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jalan: ${{ steps.cek.outputs.jalan }}
    steps:
      - name: Sudah sukses hari ini?
        id: cek
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Run manual -> selalu jalan"
            echo "jalan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hari_ini=$(date -u +%Y-%m-%d)   # 16.30-17.00 WIB masih tanggal UTC yang sama
          sukses=$(gh run list -R "${{ github.repository }}" -w agent-kumbang.yml \
                     -e schedule -s success -L 20 --json createdAt \
                     --jq "[.[] | select(.createdAt | startswith(\"$hari_ini\"))] | length")
          echo "Run terjadwal yang sudah SUKSES hari ini: $sukses"
          if [ "$sukses" -gt 0 ]; then
            echo "Sudah sukses hari ini -> jadwal cadangan ini DILEWATI"
            echo "jalan=false" >> "$GITHUB_OUTPUT"
          else
            echo "jalan=true" >> "$GITHUB_OUTPUT"
          fi

  agent-kumbang:
    needs: cek-jadwal
    if: needs.cek-jadwal.outputs.jalan == 'true'
    # Dikunci ke 24.04: versi Ubuntu yang resmi didukung Playwright 1.52 (ubuntu-latest bisa lebih baru)
    runs-on: ubuntu-24.04
    # Agent mengulang sendiri sampai sukses (maks sampai AGENT_BATAS_JAM); 170 menit = 16.30 -> ±19.20
    timeout-minutes: 170
    env:
      TZ: Asia/Jakarta
      AGENT_BATAS_JAM: "19:00"
      AGENT_JEDA_MENIT: "3"
      HM_BASE_URL: https://pinuspackindo.hashmicro.co
      HM_TEMPLATE_BILLS: Tools Purchase (Daily)
      PORTAL_URL: https://procurement.pinuspackindo.com
      HM_USER: ${{ secrets.HM_USER }}
      HM_PASS: ${{ secrets.HM_PASS }}
      PORTAL_USER: ${{ secrets.PORTAL_USER }}
      PORTAL_PIN: ${{ secrets.PORTAL_PIN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Pasang paket Python
        run: pip install -r requirements.txt

      - name: Pasang browser Chromium
        run: python -m playwright install --with-deps chromium

      - name: Jalankan Agent Kumbang
        run: |
          if [ "${{ github.event.inputs.mode }}" = "cek" ]; then
            python src/agent_kumbang.py --cek
          else
            python src/agent_kumbang.py
          fi

      - name: Simpan log & file hasil (14 hari)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: agent-kumbang-${{ github.run_number }}
          path: |
            logs/
            data/hasil/
          retention-days: 14
